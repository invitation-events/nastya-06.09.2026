<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Приглашение</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #1e1e1e;
      line-height: 1.5;
      overflow-y: scroll;
    }
    h1, h2, h3, .hero .names, .date, .love, .title, .month, .location h2, .timing h2,
    .dresscode-section h2, .details-section h2, .wedding-block h1,
    .contacts-block h2, .invite, .names-sign, .music-text, .time, .sub, .subtitle,
    .timer span, .calendar-date {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      letter-spacing: 1px;
    }
    p, .text, .desc, .person, .address, .footer-text, .note, label, .radio-group, button, .btn, .btn-location, .time {
      font-family: 'Inter', sans-serif;
    }

    /* Блоки с картинками */
    .block-img {
      width: 100%;
      display: block;
    }
    .block-img img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Фоновые блоки */
    .block-bg {
      width: 100%;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* Третий блок – фото с кружками */
    .block-bg-3 {
      background-image: url('image_2026-08-11_12-04-560.png');
      background-position: center bottom;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 90px;
    }
    .circles {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid #f3a4b4;
      box-shadow: none;
      transition: transform 0.2s ease;
    }
    .circle-1 { background: #ffffff; }
    .circle-2 { background: #fdf6ee; }
    .circle-3 { background: #f5ede0; }
    .circle-4 { background: #f0e6d3; }
    .circle-5 { background: #e8dcc8; }
    .circle:hover { transform: scale(1.05); }

    /* ===== ЧЕТВЁРТЫЙ БЛОК – АНКЕТА (чёрный шрифт, смещена влево) ===== */
    .block-bg-4 {
      background-image: url('image_2026-08-11_12-37-089.png');
      background-size: cover;
      background-position: center;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: flex-start;   /* прижимаем к левому краю */
      align-items: center;
      padding: 30px 20px;
    }

    .rsvp {
      width: 100%;
      max-width: 580px;
      margin: 0;
      background: transparent;
      color: #1e1e1e;               /* чёрный шрифт */
      text-align: left;
      padding: 20px 10px 20px 30px; /* увеличен отступ слева */
    }

    .rsvp form {
      text-align: left;
    }

    .rsvp label {
      display: block;
      font-size: 16px;
      margin: 22px 0 8px;
      font-weight: 500;
      color: #1e1e1e;               /* чёрный */
      text-shadow: none;            /* убрали тень */
    }

    .rsvp input[type="text"] {
      width: 100%;
      border: none;
      border-bottom: 1px solid #1e1e1e; /* чёрная линия */
      background: transparent;
      padding: 10px 0;
      color: #1e1e1e;
      outline: none;
      font-size: 16px;
    }
    .rsvp input[type="text"]::placeholder {
      color: #888;
    }

    /* Кастомные радио-кнопки – чёрная обводка, розовое выделение */
    .rsvp .custom-radio {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
      cursor: pointer;
      font-weight: normal;
      color: #1e1e1e;
      position: relative;
    }
    .rsvp .custom-radio input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .rsvp .radio-mark {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid #1e1e1e;     /* чёрная обводка */
      border-radius: 50%;
      position: relative;
      transition: all 0.2s;
      flex-shrink: 0;
      background: transparent;
    }
    .rsvp .custom-radio input:checked ~ .radio-mark {
      border-color: #f3a4b4;         /* розовый при выборе */
      background: rgba(243, 164, 180, 0.2);
    }
    .rsvp .custom-radio input:checked ~ .radio-mark::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f3a4b4;           /* розовая точка */
    }

    /* Чекбоксы – чёрная обводка, розовый фон при выборе */
    .rsvp .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0;
      cursor: pointer;
      font-weight: normal;
      color: #1e1e1e;
    }
    .rsvp .custom-checkbox input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .rsvp .checkmark {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid #1e1e1e;     /* чёрная обводка */
      border-radius: 4px;
      position: relative;
      transition: all 0.2s;
      flex-shrink: 0;
      background: transparent;
    }
    .rsvp .custom-checkbox input:checked ~ .checkmark {
      background: #f3a4b4;           /* розовый фон */
      border-color: #f3a4b4;
    }
    .rsvp .custom-checkbox input:checked ~ .checkmark::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    .rsvp .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }
    .rsvp .checkbox-group .custom-checkbox {
      margin: 0;
    }

    .rsvp button {
      width: 100%;
      margin-top: 40px;
      padding: 14px;
      border: 1px solid #1e1e1e;     /* чёрная обводка */
      border-radius: 50px;
      background: transparent;
      color: #1e1e1e;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      text-shadow: none;
    }
    .rsvp button:hover {
      background: #1e1e1e;
      color: #fff;
    }

    /* Сообщение под кнопкой – чёрный текст на светлом фоне */
    .form-message {
      margin-top: 20px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.85);
      color: #1e1e1e;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 400;
      text-align: center;
      display: none;
      border: 1px solid #ccc;
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
      margin-left: auto;
      margin-right: auto;
    }
    .form-message.show { display: block; }
    .form-message.error {
      background: rgba(252, 228, 224, 0.9);
      color: #7a2e1a;
      border-color: #dbb0a8;
    }

    /* Адаптив */
    @media (max-width: 680px) {
      .block-bg-3 { padding-bottom: 70px; }
      .circle { width: 60px; height: 60px; }
      .circles { gap: 18px; }
      .rsvp { padding-left: 20px; padding-right: 10px; }
      .rsvp label { font-size: 15px; }
      .rsvp input[type="text"] { font-size: 15px; }
      .rsvp button { font-size: 15px; padding: 12px; }
      .form-message { font-size: 15px; padding: 12px 16px; }
      .block-bg-4 { padding: 20px 15px; }
    }
    @media (max-width: 480px) {
      .block-bg-3 { padding-bottom: 60px; }
      .circle { width: 50px; height: 50px; }
      .circles { gap: 14px; }
      .rsvp { padding-left: 15px; }
    }
  </style>
</head>
<body>

  <!-- БЛОК 1: ФОТО -->
  <div class="block-img">
    <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
  </div>

  <!-- БЛОК 2: ФОТО -->
  <div class="block-img">
    <img src="image_2026-08-11_11-41-430.png" alt="Фото 2" />
  </div>

  <!-- БЛОК 3: ФОНОВОЕ ФОТО + КРУЖКИ -->
  <div class="block-bg block-bg-3">
    <div class="circles">
      <span class="circle circle-1"></span>
      <span class="circle circle-2"></span>
      <span class="circle circle-3"></span>
      <span class="circle circle-4"></span>
      <span class="circle circle-5"></span>
    </div>
  </div>

  <!-- БЛОК 4: ФОНОВОЕ ФОТО + АНКЕТА (без заголовка, чёрный шрифт, смещена влево) -->
  <div class="block-bg block-bg-4">
    <section class="rsvp">
      <form id="rsvpForm">
        <label>Ваше имя и фамилия</label>
        <input type="text" name="name" id="guestName" placeholder="Имя и фамилия" required>

        <label>Сможете ли Вы присутствовать?</label>
        <div class="radio-group">
          <label class="custom-radio">
            <input type="radio" name="attend" value="Да, смогу" required>
            <span class="radio-mark"></span> Да, смогу
          </label>
          <label class="custom-radio">
            <input type="radio" name="attend" value="Нет, не смогу">
            <span class="radio-mark"></span> Нет, не смогу
          </label>
        </div>

        <label>Предпочтения по алкоголю (можно выбрать несколько)</label>
        <div class="checkbox-group">
          <label class="custom-checkbox"><input type="checkbox" name="alcohol[]" value="Вино"><span class="checkmark"></span> Вино</label>
          <label class="custom-checkbox"><input type="checkbox" name="alcohol[]" value="Виски / Ром"><span class="checkmark"></span> Виски / Ром</label>
          <label class="custom-checkbox"><input type="checkbox" name="alcohol[]" value="Пиво"><span class="checkmark"></span> Пиво</label>
          <label class="custom-checkbox"><input type="checkbox" name="alcohol[]" value="Шампанское"><span class="checkmark"></span> Шампанское</label>
          <label class="custom-checkbox"><input type="checkbox" name="alcohol[]" value="Не пью"><span class="checkmark"></span> Не пью алкоголь</label>
        </div>

        <button type="submit" id="submitBtn">Отправить</button>
        <div id="formMessage" class="form-message"></div>
      </form>
    </section>
  </div>

  <script>
    const rsvpForm = document.getElementById('rsvpForm');
    const formMessage = document.getElementById('formMessage');

    rsvpForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const nameInput = document.getElementById('guestName');
      const name = nameInput ? nameInput.value.trim() : '';

      if (name === '') {
        formMessage.className = 'form-message show error';
        formMessage.textContent = 'Пожалуйста, укажите ваше имя и фамилию.';
        nameInput.focus();
        return;
      }

      const attendanceRadios = document.querySelectorAll('input[name="attend"]');
      let attendance = '';
      for (let radio of attendanceRadios) {
        if (radio.checked) { attendance = radio.value; break; }
      }
      if (!attendance) {
        formMessage.className = 'form-message show error';
        formMessage.textContent = 'Пожалуйста, выберите вариант присутствия.';
        return;
      }

      const alcoholCheckboxes = document.querySelectorAll('input[name="alcohol[]"]:checked');
      const alcoholValues = Array.from(alcoholCheckboxes).map(cb => cb.value);
      const alcoholString = alcoholValues.length ? alcoholValues.join(', ') : 'Не выбрано';

      let message = 'Ваш ответ:\n';
      message += 'Имя: ' + name + '\n';
      message += 'Присутствие: ' + attendance + '\n';
      message += 'Алкоголь: ' + alcoholString;
      alert(message);

      formMessage.className = 'form-message show';
      formMessage.textContent = 'Спасибо! Ваш ответ получен.';
      rsvpForm.reset();

      setTimeout(() => {
        formMessage.classList.remove('show');
      }, 5000);
    });
  </script>

</body>
</html>
