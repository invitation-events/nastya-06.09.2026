<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            background: #ffffff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* Блоки с картинками (обычные img) */
        .block-img {
            width: 100%;
            display: block;
        }
        .block-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Фоновые блоки */
        .block-bg {
            width: 100%;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Третий блок – фото с кружками (обрезан сверху) */
        .block-bg-3 {
            background-image: url('image_2026-08-11_12-04-560.png');
            background-position: center bottom;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 90px;
        }

        .circles {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid #f3a4b4;
            box-shadow: none;
            transition: transform 0.2s ease;
        }

        .circle-1 { background: #ffffff; }
        .circle-2 { background: #fdf6ee; }
        .circle-3 { background: #f5ede0; }
        .circle-4 { background: #f0e6d3; }
        .circle-5 { background: #e8dcc8; }

        .circle:hover {
            transform: scale(1.05);
        }

        /* ===== ЧЕТВЁРТЫЙ БЛОК – ПЕРЕРАБОТАН ===== */
        .block-bg-4 {
            background-image: url('image_2026-08-11_12-37-089.png');
            background-size: cover;
            background-position: center;
            width: 100%;
            padding: 40px 20px;
            height: auto;               /* высота по содержимому */
            display: flex;
            justify-content: center;
        }

        .survey {
            max-width: 650px;
            width: 100%;
            /* никакого фона, только отступы */
            padding: 0;
        }

        /* Каждая группа – вопрос */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group:last-of-type {
            margin-bottom: 0;
        }

        .form-group > label {
            display: block;
            font-weight: 600;
            font-size: 1.1rem;
            color: #9bbf8b;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Поля ввода – сплошной белый фон */
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            background: #ffffff;
            color: #333;
            transition: border 0.2s;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: #f3a4b4;
        }

        /* Группа радиокнопок и чекбоксов – элементы в столбик */
        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;   /* все в столбик */
            gap: 8px;
            margin-top: 4px;
        }

        .radio-group label,
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            line-height: 1.4;
        }

        /* Кастомные радио и чекбоксы */
        .radio-group input[type="radio"],
        .checkbox-group input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.15s;
            cursor: pointer;
            position: relative;
        }
        .radio-group input[type="radio"]:checked {
            border-color: #f3a4b4;
            background: #f3a4b4;
            box-shadow: inset 0 0 0 4px #fff;
        }
        .checkbox-group input[type="checkbox"] {
            border-radius: 4px;
        }
        .checkbox-group input[type="checkbox"]:checked {
            border-color: #f3a4b4;
            background: #f3a4b4;
            box-shadow: inset 0 0 0 4px #fff;
        }

        /* Блок дополнительных полей (количество гостей) */
        .sub-fields {
            margin-top: 12px;
            padding-left: 16px;
            border-left: 3px solid #f3a4b4;
            display: none;
            flex-direction: column;   /* столбик */
            gap: 12px;
            animation: fadeIn 0.25s ease;
        }
        .sub-fields.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sub-fields .field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sub-fields .field label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #9bbf8b;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        .sub-fields .field input {
            width: 100%;
            max-width: 180px;          /* не растягиваем на всю ширину */
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #ffffff;
        }

        .btn-submit {
            background: #f3a4b4;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            max-width: 200px;           /* чтобы кнопка не на весь экран */
            margin-top: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .btn-submit:hover {
            background: #e88a9d;
        }
        .btn-submit:active {
            transform: scale(0.97);
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 600px) {
            .block-bg-3 {
                padding-bottom: 70px;
            }
            .circle {
                width: 50px;
                height: 50px;
            }
            .circles {
                gap: 16px;
            }

            .block-bg-4 {
                padding: 30px 16px;
            }
            .form-group {
                margin-bottom: 16px;
            }
            .form-group > label {
                font-size: 1rem;
            }
            .radio-group label,
            .checkbox-group label {
                font-size: 0.9rem;
            }
            .sub-fields .field input {
                max-width: 100%;        /* на телефоне поля растягиваются */
            }
            .btn-submit {
                max-width: 100%;
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Блок 1: фото -->
    <div class="block-img">
        <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
    </div>

    <!-- Блок 2: фото -->
    <div class="block-img">
        <img src="image_2026-08-11_11-41-430.png" alt="Фото 2" />
    </div>

    <!-- Блок 3: фон + кружки -->
    <div class="block-bg block-bg-3">
        <div class="circles">
            <span class="circle circle-1"></span>
            <span class="circle circle-2"></span>
            <span class="circle circle-3"></span>
            <span class="circle circle-4"></span>
            <span class="circle circle-5"></span>
        </div>
    </div>

    <!-- Блок 4: фон + анкета (переработана) -->
    <div class="block-bg block-bg-4">
        <div class="survey">
            <form id="guestForm">

                <!-- Имя -->
                <div class="form-group">
                    <label>Ваше имя и фамилия</label>
                    <input type="text" placeholder="Например, Анна Иванова" />
                </div>

                <!-- Присутствие -->
                <div class="form-group">
                    <label>Будете ли присутствовать?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="attendance" value="yes" /> Да</label>
                        <label><input type="radio" name="attendance" value="no" /> Нет</label>
                        <label><input type="radio" name="attendance" value="maybe" /> Не знаю</label>
                    </div>
                    <div class="sub-fields" id="guestCountFields">
                        <div class="field">
                            <label>Количество гостей с вами (взрослых)</label>
                            <input type="number" name="adults" min="0" value="0" />
                        </div>
                        <div class="field">
                            <label>Количество детей</label>
                            <input type="number" name="children" min="0" value="0" />
                        </div>
                    </div>
                </div>

                <!-- Алкоголь -->
                <div class="form-group">
                    <label>Предпочтения по алкоголю (можно выбрать несколько)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="alcohol" value="wine" /> Вино</label>
                        <label><input type="checkbox" name="alcohol" value="whisky" /> Виски / Ром</label>
                        <label><input type="checkbox" name="alcohol" value="beer" /> Пиво</label>
                        <label><input type="checkbox" name="alcohol" value="champagne" /> Шампанское</label>
                        <label><input type="checkbox" name="alcohol" value="none" /> Не пью алкоголь</label>
                    </div>
                </div>

                <button type="button" class="btn-submit" onclick="submitForm()">Отправить</button>
            </form>
        </div>
    </div>

    <script>
        const radioButtons = document.querySelectorAll('input[name="attendance"]');
        const guestFields = document.getElementById('guestCountFields');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'yes' && this.checked) {
                    guestFields.classList.add('visible');
                } else {
                    guestFields.classList.remove('visible');
                }
            });
        });

        function submitForm() {
            const name = document.querySelector('input[placeholder]').value.trim() || 'не указано';
            const attendance = document.querySelector('input[name="attendance"]:checked');
            const adults = document.querySelector('input[name="adults"]').value;
            const children = document.querySelector('input[name="children"]').value;
            const alcoholChecks = document.querySelectorAll('input[name="alcohol"]:checked');
            const alcoholValues = Array.from(alcoholChecks).map(cb => cb.value);

            if (!attendance) {
                alert('Пожалуйста, выберите вариант присутствия.');
                return;
            }

            let message = 'Ваш ответ:\n';
            message += 'Имя: ' + name + '\n';
            message += 'Присутствие: ' + attendance.value + '\n';
            if (attendance.value === 'yes') {
                message += 'Взрослых: ' + adults + '\n';
                message += 'Детей: ' + children + '\n';
            }
            message += 'Алкоголь: ' + (alcoholValues.length ? alcoholValues.join(', ') : 'Не выбрано');

            alert(message);
        }
    </script>

</body>
</html>
