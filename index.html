<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            background: #ffffff;
            font-family: sans-serif;
        }

        /* Первый блок – фото как картинка (занимает свою натуральную высоту) */
        .block-img {
            width: 100%;
            display: block;
        }
        .block-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Второй блок – фоновое фото на весь экран */
        .block-bg {
            width: 100%;
            height: 100vh;
            background-image: url('image_2026-08-11_11-41-430.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <!-- Первое фото (обычная картинка) -->
    <div class="block-img">
        <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
    </div>

    <!-- Второе фото (фон на весь экран) -->
    <div class="block-bg"></div>

</body>
</html>
