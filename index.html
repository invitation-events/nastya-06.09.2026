<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            background: #ffffff;
            font-family: sans-serif;
        }

        /* Первый блок – фото как картинка */
        .block-img {
            width: 100%;
            display: block;
        }
        .block-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Общие стили для фоновых блоков */
        .block-bg {
            width: 100%;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Второй блок – обрезаем снизу, но меньше (92vh вместо 85) */
        .block-bg-2 {
            background-image: url('image_2026-08-11_11-41-430.png');
            background-position: center top;
            height: 92vh;              /* увеличено, чтобы меньше обрезать */
        }

        /* Третий блок – обрезаем сверху, кружки подняты выше */
        .block-bg-3 {
            background-image: url('image_2026-08-11_12-04-560.png');
            background-position: center bottom;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 50px;      /* подняли кружки на 10px (было 40) */
        }

        /* Кружки */
        .circles {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #9bbf8b;
            box-shadow: none;
            transition: transform 0.2s ease;
        }

        .circle-1 { background: #ffffff; }
        .circle-2 { background: #fdf6ee; }
        .circle-3 { background: #f5ede0; }
        .circle-4 { background: #f0e6d3; }
        .circle-5 { background: #e8dcc8; }

        .circle:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .circle {
                width: 30px;
                height: 30px;
            }
            .circles {
                gap: 10px;
            }
            .block-bg-2 {
                height: 87vh;          /* чуть меньше на мобилках, но тоже увеличено */
            }
            .block-bg-3 {
                padding-bottom: 40px;   /* адаптивный подъём */
            }
        }
    </style>
</head>
<body>

    <!-- Первое фото -->
    <div class="block-img">
        <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
    </div>

    <!-- Второй блок – обрезан снизу, но меньше -->
    <div class="block-bg block-bg-2"></div>

    <!-- Третий блок – обрезан сверху + кружки выше -->
    <div class="block-bg block-bg-3">
        <div class="circles">
            <span class="circle circle-1"></span>
            <span class="circle circle-2"></span>
            <span class="circle circle-3"></span>
            <span class="circle circle-4"></span>
            <span class="circle circle-5"></span>
        </div>
    </div>

</body>
</html>
