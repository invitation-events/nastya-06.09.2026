<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Настюше 1 год! Праздник для детей и взрослых</title>
    <meta name="description" content="6 сентября — день, когда нашей Настюше исполнился годик! Вместе играем, веселимся, обнимаемся и создаём тёплые воспоминания. Семейный уют, детский смех и радость без границ." />

    <meta property="og:title" content="Настюша празднует 1 годик" />
    <meta property="og:description" content="6 сентября — уютный семейный праздник с играми для детей и взрослых. Счастье быть вместе!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="URL_ВАШЕЙ_СТРАНИЦЫ" />
    <meta property="og:image" content="URL_ИЗОБРАЖЕНИЯ" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .block {
            height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .block-1 {
            background-image: url('1.png');
        }

        .block-2 {
            background-image: url('IMG_9381.PNG');
        }

        .block-3 {
            background-image: url('2.png');
        }

        /* ---- Белый блок с анкетой (прижат к верху) ---- */
        .block-4 {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;    /* прижимаем к верху */
            align-items: center;
            padding: 20px 20px 0 20px;      /* сверху 20px, снизу 0 */
        }

        .invite-text {
            font-size: 1.3rem;
            font-weight: 500;
            color: #9bbf8b;
            margin-bottom: 8px;             /* минимальный отступ до формы */
            text-align: center;
            padding-top: 10px;
        }

        .form-container {
            max-width: 700px;
            width: 100%;
            padding: 35px 30px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 26px;
        }

        .form-group:last-of-type {
            margin-bottom: 18px;
        }

        .form-group > label {
            display: block;
            font-weight: 600;
            color: #9bbf8b;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            align-items: center;
        }

        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            font-size: 0.95rem;
            margin-bottom: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #333;
        }

        .radio-group input[type="radio"],
        .checkbox-group input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #d0d0d0;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            background: #fff;
            position: relative;
        }

        .radio-group input[type="radio"]:checked {
            border-color: #f3a4b4;
            background: #f3a4b4;
            box-shadow: inset 0 0 0 4px #fff;
        }

        .radio-group input[type="radio"]:hover {
            border-color: #f3a4b4;
        }

        .checkbox-group input[type="checkbox"] {
            border-radius: 4px;
        }

        .checkbox-group input[type="checkbox"]:checked {
            border-color: #f3a4b4;
            background: #f3a4b4;
            box-shadow: inset 0 0 0 4px #fff;
        }

        .checkbox-group input[type="checkbox"]:hover {
            border-color: #f3a4b4;
        }

        .sub-fields {
            margin-top: 12px;
            padding-left: 16px;
            border-left: 3px solid #f3a4b4;
            display: none;
            flex-wrap: wrap;
            gap: 16px;
            animation: fadeIn 0.25s ease;
        }

        .sub-fields.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sub-fields .field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sub-fields .field label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #9bbf8b;
            margin-bottom: 0;
        }

        .sub-fields .field input {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.95rem;
            width: 140px;
            background: #fafafa;
            transition: border 0.2s;
        }

        .sub-fields .field input:focus {
            outline: none;
            border-color: #f3a4b4;
            box-shadow: 0 0 0 3px rgba(243, 164, 180, 0.12);
        }

        .btn-submit {
            background: #f3a4b4;
            border: none;
            padding: 12px 36px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            box-shadow: 0 4px 12px rgba(243, 164, 180, 0.2);
        }

        .btn-submit:hover {
            background: #e88a9d;
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        @media (max-width: 600px) {
            .block-4 {
                padding: 10px 10px 0 10px;
            }
            .form-container {
                padding: 20px 16px;
                font-size: 0.9rem;
            }
            .radio-group,
            .checkbox-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .sub-fields {
                flex-direction: column;
                gap: 10px;
            }
            .sub-fields .field input {
                width: 100%;
            }
            .form-group > label {
                font-size: 0.95rem;
            }
            .invite-text {
                font-size: 1.1rem;
                padding-top: 5px;
                margin-bottom: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="block block-1"></div>
    <div class="block block-2"></div>
    <div class="block block-3"></div>

    <div class="block block-4">
        <p class="invite-text">Пожалуйста, заполните анкету</p>
        <div class="form-container">
            <form id="guestForm">
                <div class="form-group">
                    <label>Сможете ли присутствовать?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="attendance" value="yes" /> Да</label>
                        <label><input type="radio" name="attendance" value="no" /> Нет</label>
                        <label><input type="radio" name="attendance" value="maybe" /> Не знаю</label>
                    </div>
                    <div class="sub-fields" id="guestCountFields">
                        <div class="field">
                            <label>Количество гостей с вами (взрослых)</label>
                            <input type="number" name="adults" min="0" value="0" />
                        </div>
                        <div class="field">
                            <label>Количество детей</label>
                            <input type="number" name="children" min="0" value="0" />
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Предпочтения по алкоголю (можно выбрать несколько)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="alcohol" value="wine" /> Вино</label>
                        <label><input type="checkbox" name="alcohol" value="whisky" /> Виски / Ром</label>
                        <label><input type="checkbox" name="alcohol" value="beer" /> Пиво</label>
                        <label><input type="checkbox" name="alcohol" value="champagne" /> Шампанское</label>
                        <label><input type="checkbox" name="alcohol" value="none" /> Не пью алкоголь</label>
                    </div>
                </div>

                <button type="button" class="btn-submit" onclick="submitForm()">Отправить</button>
            </form>
        </div>
    </div>

    <script>
        const radioButtons = document.querySelectorAll('input[name="attendance"]');
        const guestFields = document.getElementById('guestCountFields');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'yes' && this.checked) {
                    guestFields.classList.add('visible');
                } else {
                    guestFields.classList.remove('visible');
                }
            });
        });

        function submitForm() {
            const attendance = document.querySelector('input[name="attendance"]:checked');
            const adults = document.querySelector('input[name="adults"]').value;
            const children = document.querySelector('input[name="children"]').value;
            const alcoholChecks = document.querySelectorAll('input[name="alcohol"]:checked');
            const alcoholValues = Array.from(alcoholChecks).map(cb => cb.value);

            if (!attendance) {
                alert('Пожалуйста, выберите вариант присутствия.');
                return;
            }

            let message = 'Ваш ответ:\n';
            message += 'Присутствие: ' + attendance.value + '\n';
            if (attendance.value === 'yes') {
                message += 'Взрослых: ' + adults + '\n';
                message += 'Детей: ' + children + '\n';
            }
            message += 'Алкоголь: ' + (alcoholValues.length ? alcoholValues.join(', ') : 'Не выбрано');

            alert(message);
        }
    </script>
</body>
</html>
