<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            background: #ffffff;
            font-family: sans-serif;
        }

        /* Первый блок – фото как картинка */
        .block-img {
            width: 100%;
            display: block;
        }
        .block-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Общие стили для фоновых блоков */
        .block-bg {
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Второй блок – обрезаем снизу за счёт уменьшения высоты */
        .block-bg-2 {
            background-image: url('image_2026-08-11_11-41-430.png');
            height: 85vh;                /* меньше 100vh → низ обрезается */
        }

        /* Третий блок – обрезаем сверху (тоже уменьшаем высоту, но фон по центру) */
        .block-bg-3 {
            background-image: url('image_2026-08-11_12-04-560.png');
            height: 85vh;                /* верх и низ обрезаются равномерно */
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;         /* кружки выше */
        }

        /* Кружки */
        .circles {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .circle {
            width: 36px;                 /* чуть меньше */
            height: 36px;
            border-radius: 50%;
            border: none;
            box-shadow: none;
            transition: transform 0.2s ease;
        }

        .circle-1 { background: #ffffff; }
        .circle-2 { background: #fdf6ee; }
        .circle-3 { background: #f5ede0; }
        .circle-4 { background: #f0e6d3; }
        .circle-5 { background: #e8dcc8; }

        .circle:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .circle {
                width: 30px;
                height: 30px;
            }
            .circles {
                gap: 10px;
            }
            .block-bg-2,
            .block-bg-3 {
                height: 80vh;            /* на мобилках ещё меньше */
            }
            .block-bg-3 {
                padding-bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Первое фото -->
    <div class="block-img">
        <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
    </div>

    <!-- Второй блок – обрезан снизу (высота 85vh) -->
    <div class="block-bg block-bg-2"></div>

    <!-- Третий блок – обрезан сверху и снизу (высота 85vh) + кружки -->
    <div class="block-bg block-bg-3">
        <div class="circles">
            <span class="circle circle-1"></span>
            <span class="circle circle-2"></span>
            <span class="circle circle-3"></span>
            <span class="circle circle-4"></span>
            <span class="circle circle-5"></span>
        </div>
    </div>

</body>
</html>
