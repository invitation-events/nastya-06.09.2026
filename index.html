<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            background: #ffffff;
            font-family: sans-serif;
        }

        /* Первый блок – фото как картинка */
        .block-img {
            width: 100%;
            display: block;
        }
        .block-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Общие стили для фоновых блоков */
        .block-bg {
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Второй блок – обрезаем снизу (смещаем вверх) */
        .block-bg-2 {
            background-image: url('image_2026-08-11_11-41-430.png');
            background-position: center 70%; /* чуть выше центра → низ обрезается */
        }

        /* Третий блок – обрезаем сверху (смещаем вниз) */
        .block-bg-3 {
            background-image: url('image_2026-08-11_12-04-560.png');
            background-position: center 30%; /* чуть ниже центра → верх обрезается */
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 25px; /* уменьшили отступ, кружки поднялись выше */
        }

        /* Контейнер для кружков */
        .circles {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Кружки без обводок, уменьшенные */
        .circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            box-shadow: none;
            transition: transform 0.2s ease;
        }

        /* Оттенки белого и бежевого */
        .circle-1 { background: #ffffff; }
        .circle-2 { background: #fdf6ee; }
        .circle-3 { background: #f5ede0; }
        .circle-4 { background: #f0e6d3; }
        .circle-5 { background: #e8dcc8; }

        .circle:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .circle {
                width: 32px;
                height: 32px;
            }
            .circles {
                gap: 12px;
            }
            .block-bg-3 {
                padding-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Первое фото (обычная картинка) -->
    <div class="block-img">
        <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
    </div>

    <!-- Второе фото (фон, обрезан снизу) -->
    <div class="block-bg block-bg-2"></div>

    <!-- Третье фото (фон, обрезан сверху) + кружки -->
    <div class="block-bg block-bg-3">
        <div class="circles">
            <span class="circle circle-1"></span>
            <span class="circle circle-2"></span>
            <span class="circle circle-3"></span>
            <span class="circle circle-4"></span>
            <span class="circle circle-5"></span>
        </div>
    </div>

</body>
</html>
