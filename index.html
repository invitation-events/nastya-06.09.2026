<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            background: #ffffff;
            font-family: sans-serif;
        }

        /* Первый блок – фото как картинка (занимает свою натуральную высоту) */
        .block-img {
            width: 100%;
            display: block;
        }
        .block-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Второй блок – фоновое фото на весь экран */
        .block-bg {
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .block-bg-2 {
            background-image: url('image_2026-08-11_11-41-430.png');
        }

        /* Третий блок – фоновое фото + кружки внизу */
        .block-bg-3 {
            background-image: url('image_2026-08-11_12-04-560.png');
            position: relative;
            display: flex;
            align-items: flex-end;      /* прижимаем кружки к низу */
            justify-content: center;
            padding-bottom: 40px;       /* отступ от края экрана */
        }

        /* Контейнер для кружков */
        .circles {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Каждый кружок – без обводки, просто заливка */
        .circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;              /* убираем обводку */
            box-shadow: none;          /* убираем тени */
            background: #ffffff;       /* базовый белый */
            transition: transform 0.2s ease;
        }

        /* Оттенки бежевого и белого – без обводок */
        .circle-1 { background: #ffffff; }
        .circle-2 { background: #fdf6ee; }
        .circle-3 { background: #f5ede0; }
        .circle-4 { background: #f0e6d3; }
        .circle-5 { background: #e8dcc8; }

        /* Лёгкий hover (опционально) */
        .circle:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .circle {
                width: 40px;
                height: 40px;
            }
            .circles {
                gap: 14px;
            }
            .block-bg-3 {
                padding-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Первое фото (обычная картинка) -->
    <div class="block-img">
        <img src="image_2026-08-11_11-27-148.png" alt="Фото 1" />
    </div>

    <!-- Второе фото (фон на весь экран) -->
    <div class="block-bg block-bg-2"></div>

    <!-- Третье фото (фон на весь экран) + 5 кружков внизу -->
    <div class="block-bg block-bg-3">
        <div class="circles">
            <span class="circle circle-1"></span>
            <span class="circle circle-2"></span>
            <span class="circle circle-3"></span>
            <span class="circle circle-4"></span>
            <span class="circle circle-5"></span>
        </div>
    </div>

</body>
</html>
