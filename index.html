<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden; /* убираем скролл, если нужно только одно фото */
            height: 100vh;
        }

        .block-photo {
            height: 100vh;
            width: 100%;
            background-image: url('image_2026-08-11_11-27-148.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div class="block-photo"></div>
</body>
</html>
