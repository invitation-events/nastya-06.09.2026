<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Приглашение на 1 годик Настюше</title>

    <!-- Open Graph (для соцсетей) -->
    <meta property="og:title" content="Приглашение на 1 годик Настюше" />
    <meta property="og:description" content="6 сентября 2026 — приглашаем на праздник!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="URL_ВАШЕЙ_СТРАНИЦЫ" />
    <meta property="og:image" content="URL_ИЗОБРАЖЕНИЯ_ДЛЯ_ПРЕВЬЮ" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-y: scroll;
            height: 100%;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* Общие стили для блоков */
        .block {
            height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Первый блок – фото 1 */
        .block-1 {
            background-image: url('image_2026-08-11_11-27-148.png');
        }

        /* Второй блок – фото 2 с текстом поверх */
        .block-2 {
            background-image: url('image_2026-08-11_11-49-083.png');
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Полупрозрачная подложка для читаемости текста */
        .overlay {
            background: rgba(255, 255, 255, 0.15); /* очень лёгкая, чтобы текст был виден */
            padding: 40px 30px;
            border-radius: 30px;
            max-width: 750px;
            width: 90%;
            backdrop-filter: blur(2px); /* лёгкий блюр, если поддерживается */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Основные цвета */
        .color-pink {
            color: #f3a4b4; /* нежный розовый */
        }
        .color-green {
            color: #9bbf8b; /* пастельный зелёный */
        }

        /* Текст внутри */
        .invite-title {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .invite-date {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .invite-date .day {
            color: #f3a4b4;  /* розовый */
        }
        .invite-date .month-year {
            color: #9bbf8b;  /* зелёный */
            font-size: 1.6rem;
            font-weight: 400;
            display: block;
        }
        .invite-weekday {
            font-size: 1.1rem;
            color: #9bbf8b;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #f3a4b4;
            margin: 16px auto;
            border-radius: 2px;
        }

        .address {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-bottom: 6px;
        }
        .address .place {
            font-weight: 600;
            color: #f3a4b4;
        }
        .address .street {
            color: #9bbf8b;
        }

        .btn-map {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 28px;
            background: #f3a4b4;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(243, 164, 180, 0.35);
            transition: background 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
        }
        .btn-map:hover {
            background: #e88a9d;
        }
        .btn-map:active {
            transform: scale(0.97);
        }

        .timing {
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .timing .time-highlight {
            color: #f3a4b4;
            font-weight: 600;
        }
        .timing .time-green {
            color: #9bbf8b;
            font-weight: 500;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .overlay {
                padding: 24px 18px;
                width: 94%;
            }
            .invite-title {
                font-size: 1.6rem;
            }
            .invite-date {
                font-size: 2.4rem;
            }
            .invite-date .month-year {
                font-size: 1.2rem;
            }
            .address {
                font-size: 1rem;
            }
            .timing {
                font-size: 0.95rem;
            }
            .btn-map {
                font-size: 0.9rem;
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Первый блок – фото 1 -->
    <div class="block block-1"></div>

    <!-- Второй блок – фото 2 с текстом -->
    <div class="block block-2">
        <div class="overlay">
            <h1 class="invite-title color-green">Приглашение на 1 годик</h1>
            <h2 class="invite-title color-pink" style="font-size:2rem; margin-top:-6px;">Настюше</h2>

            <div class="invite-date">
                <span class="day">6</span>
                <span class="day" style="font-weight:400; color:#fff;">сентября</span>
                <span class="month-year">сентябрь 2026</span>
            </div>
            <div class="invite-weekday">воскресенье</div>

            <div class="divider"></div>

            <div class="address">
                <span class="place">Хатежино</span><br />
                <span class="street">Полевая 17</span><br />
                <span style="color:#fff;">Ивент пространство</span><br />
                <span class="place" style="font-size:1.4rem;">Party Trend</span>
            </div>

            <a href="#" class="btn-map">Показать на карте</a>

            <div class="divider" style="width:40px; margin:16px auto;"></div>

            <div class="timing">
                <div><span class="time-highlight">16:00</span> сбор гостей</div>
                <div><span class="time-highlight">16:00 – 22:00</span> <span class="time-green">праздничный ужин,</span> развлечения для детей и взрослых</div>
                <div><span class="time-highlight">22:30</span> заключительная часть вечера</div>
            </div>
        </div>
    </div>

</body>
</html>
